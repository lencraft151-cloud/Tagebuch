name: Website bauen und veröffentlichen

on:
  # Jede Änderung an Inhalten oder Code veröffentlicht die Website neu.
  # Veröffentlicht wird ausschließlich der Standard-Branch des Repositories –
  # unabhängig davon, ob er "main", "master" oder anders heißt (siehe Job unten).
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  # Regelmäßiger Neubau, damit Veröffentlichungs- und Ablaufzeitpunkte
  # auch in Sitemap, Meta-Daten und vorgerendertem HTML nachgezogen werden.
  schedule:
    - cron: '17 */6 * * *'
  # Manuell aus dem Actions-Tab startbar.
  workflow_dispatch:

permissions:
  # contents: write, damit der Aufräum-Schritt vorgemerkte Löschungen
  # tatsächlich ausführen und committen kann.
  contents: write
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig. Laufende Deployments werden nicht
# abgebrochen; ältere wartende Läufe werden verworfen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Bauen
    runs-on: ubuntu-latest
    # Pushes auf Feature-Branches lösen keine Veröffentlichung aus.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Der Verwaltungsbereich im Browser kann Dateien nur hinzufügen. Was dort
      # gelöscht wird, kommt als Markierung an und wird hier wirklich entfernt -
      # zusammen mit Bildern, die keine Reise mehr verwendet.
      - name: Aufräumen
        id: cleanup
        run: npm run cleanup

      - name: Aufräumen committen
        if: steps.cleanup.outputs.removed != '' && steps.cleanup.outputs.removed != '0'
        # Scheitert der Push (geschützter Branch, fehlende Rechte), soll das die
        # Veröffentlichung nicht aufhalten: Der Build läuft ohnehin schon auf dem
        # aufgeräumten Stand, nur das Repository hinkt dann hinterher.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content
          git commit \
            -m "Aufgeräumt: ${{ steps.cleanup.outputs.removed }} Datei(en) entfernt" \
            -m "Vorgemerkte Löschungen ausgeführt und nicht mehr verwendete Bilder entfernt. Automatisch erzeugt vom Veröffentlichungs-Workflow."
          git push

      - name: Inhalte prüfen
        run: npm run check

      - name: GitHub Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Aktiviert GitHub Pages beim ersten Lauf selbst und stellt die
          # Quelle auf "GitHub Actions" - spart den manuellen Schritt in den
          # Repository-Einstellungen.
          enablement: true

      - name: Website bauen
        run: npm run build
        env:
          # Liefert den korrekten Unterpfad – auch bei eigener Domain.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Der Verwaltungsbereich liest die Inhalte aus genau diesem Zweig.
          SITE_BRANCH: ${{ github.ref_name }}

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
